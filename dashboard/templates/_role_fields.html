{% macro role_fields(role, job_age_choices) %}
<label class="field">
  <span>Job title</span>
  <input name="role" value="{{ role.role if role else '' }}" placeholder="e.g. Frontend Developer" required>
</label>
<div class="row">
  <label class="field">
    <span>Cities, separated by commas</span>
    <input name="locations" value="{{ role.locations | join(', ') if role else '' }}" placeholder="e.g. Hyderabad, Bangalore, Remote">
  </label>
  <label class="field">
    <span>Lowest salary you would take, in lakhs per year (LPA)</span>
    <input name="min_salary_lpa" type="number" min="0" step="0.1" value="{{ role.min_salary_lpa | num if role else '' }}" placeholder="e.g. 6 means ₹6,00,000 a year. Empty for any" aria-describedby="salary-help">
    <span id="salary-help" class="field-help">₹50,000 a month is 6. Do not type rupees.</span>
  </label>
</div>
<label class="field">
  <span>Only jobs posted in the last</span>
  <select name="max_job_age_days">
    {% for days in job_age_choices %}
    <option value="{{ days }}"{% if (role.max_job_age_days if role else 7) == days %} selected{% endif %}>{{ days }} day{{ "" if days == 1 else "s" }}</option>
    {% endfor %}
  </select>
</label>
<div class="row">
  <label class="field">
    <span>Skip jobs with these words in the title</span>
    <input name="exclude_keywords" value="{{ role.exclude_keywords | join(', ') if role else '' }}" placeholder="e.g. Senior, Lead, Manager">
  </label>
  <label class="field">
    <span>Skip these companies</span>
    <input name="exclude_companies" value="{{ role.exclude_companies | join(', ') if role else '' }}" placeholder="Company names, separated by commas">
  </label>
</div>
{% endmacro %}
